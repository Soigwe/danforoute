<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DanfoRoute - Lagos Real Road Transit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { height: 100vh; width: 100vw; position: absolute; inset: 0; z-index: 1; }
        .leaflet-control-container { z-index: 10; }
        
        /* GNSS Pulsing dot */
        .gps-indicator {
            width: 18px;
            height: 18px;
            background-color: #2563eb;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.35);
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.8); }
            70% { box-shadow: 0 0 0 16px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* Bottom Sheet Transition for Mobile */
        .sheet-transition {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), max-height 0.35s ease;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-900 text-slate-900 select-none">

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Floating Top Bar for Mobile & Desktop -->
    <div class="absolute top-3 left-3 right-3 md:left-4 md:right-auto md:w-[380px] z-[1000] pointer-events-auto">
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-lg border border-slate-200/80 p-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-2 pl-1.5">
                <span class="text-xl">🚌</span>
                <span class="text-sm font-extrabold text-slate-900 tracking-tight">DanfoRoute</span>
            </div>
            
            <!-- Quick Action Buttons -->
            <div class="flex items-center gap-1.5">
                <button onclick="toggleSearchModal()" id="search-pill-btn" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center gap-1">
                    <span>🔍</span> <span id="search-pill-label">Route</span>
                </button>
                <button onclick="toggleAI()" class="px-2.5 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold transition flex items-center gap-1">
                    <span>✨</span> AI
                </button>
            </div>
        </div>
    </div>

    <!-- Search Modal / Drawer (Opens when user wants to change route) -->
    <div id="search-modal" class="absolute inset-x-3 top-16 md:left-4 md:right-auto md:w-[380px] z-[1001] bg-white/98 backdrop-blur-lg rounded-3xl shadow-2xl border border-slate-200 p-4 transition-all duration-300 hidden">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Plan Your Commute</h2>
            <button onclick="toggleSearchModal()" class="w-6 h-6 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 font-bold text-xs">&times;</button>
        </div>
        
        <div class="space-y-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
            <div class="flex items-center px-2 py-1">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2.5 shrink-0 ring-4 ring-emerald-100"></span>
                <select id="origin-select" class="w-full bg-transparent text-xs font-bold text-slate-800 focus:outline-none cursor-pointer truncate"></select>
            </div>
            <div class="h-px bg-slate-200/80 mx-6 relative">
                <button onclick="swapLocations()" class="absolute -top-2.5 right-2 w-5 h-5 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-600 hover:text-slate-900 text-[10px] font-bold">⇅</button>
            </div>
            <div class="flex items-center px-2 py-1">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500 mr-2.5 shrink-0 ring-4 ring-rose-100"></span>
                <select id="dest-select" class="w-full bg-transparent text-xs font-bold text-slate-800 focus:outline-none cursor-pointer truncate"></select>
            </div>
        </div>

        <!-- Preset Chips -->
        <div class="flex gap-1.5 overflow-x-auto py-2.5 no-scrollbar text-[11px]">
            <button onclick="quickSet('ELEKO', 'MILE2')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Eleko → Mile 2</button>
            <button onclick="quickSet('IKORODU', 'CMS')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Ikorodu → CMS</button>
            <button onclick="quickSet('IKEJA', 'VI')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Ikeja → VI</button>
            <button onclick="quickSet('AJAH', 'OSHODI')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Ajah → Oshodi</button>
        </div>

        <button onclick="executeRouteSearch()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider transition active:scale-95 shadow-md flex items-center justify-center gap-1.5">
            <span>🚀</span> Find Best Road Route
        </button>
    </div>

    <!-- Mobile-Optimized Bottom Sheet (Slides down to reveal map when route requested) -->
    <div id="bottom-sheet" class="sheet-transition fixed bottom-0 inset-x-0 md:inset-x-auto md:left-4 md:bottom-4 md:w-[380px] z-[1000] bg-white/95 backdrop-blur-md rounded-t-3xl md:rounded-3xl shadow-2xl border border-slate-200/80 flex flex-col pointer-events-auto max-h-[75vh] md:max-h-[80vh] overflow-hidden">
        
        <!-- Sheet Handle / Header -->
        <div onclick="toggleSheetExpand()" class="pt-2.5 pb-2 px-5 cursor-pointer flex flex-col items-center select-none border-b border-slate-100">
            <div class="w-10 h-1 bg-slate-300 rounded-full mb-2"></div>
            
            <!-- Peek Bar Summary (Always visible) -->
            <div class="w-full flex items-center justify-between">
                <div>
                    <div id="peek-badges" class="flex items-center gap-1 mb-0.5"></div>
                    <h3 id="peek-title" class="text-xs font-extrabold text-slate-900">Calculating...</h3>
                </div>
                <div class="text-right">
                    <div id="peek-fare" class="text-sm font-black text-slate-900">--</div>
                    <div id="peek-time" class="text-[11px] font-bold text-emerald-600">--</div>
                </div>
            </div>
        </div>

        <!-- Expandable Details Container -->
        <div id="sheet-content" class="overflow-y-auto px-5 py-3 space-y-3 flex-1">
            <!-- Alternative route cards or step-by-step breakdown -->
            <div id="steps-container" class="space-y-3 relative pl-3 border-l-2 border-slate-100 ml-1.5 py-1">
                <!-- Dynamically injected step cards -->
            </div>

            <!-- Start Live Navigation Action -->
            <button onclick="startNavigation(event)" id="nav-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 shadow-md transition active:scale-95">
                <span>🛰️</span>
                <span>Start Live Road GNSS Navigation</span>
            </button>
            
            <!-- Quick Safety Note -->
            <p class="text-[10px] text-slate-400 text-center pb-2">🛣️ Road paths snap to actual Lagos expressways & bridges via OSRM</p>
        </div>
    </div>

    <!-- AI Advisor Floating Modal -->
    <div id="ai-modal" class="fixed bottom-24 right-3 md:bottom-6 md:right-6 w-84 max-w-[calc(100vw-32px)] z-[1002] hidden flex-col bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">
        <div class="px-4 py-3 bg-slate-900 text-white flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-sm">🤖</span>
                <div>
                    <h3 class="text-xs font-bold leading-tight">Lagos Transit AI</h3>
                    <p class="text-[10px] text-slate-400">Road traffic & fare advisor</p>
                </div>
            </div>
            <button onclick="toggleAI()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
        </div>
        <div id="ai-chat" class="h-52 p-3 overflow-y-auto space-y-2 text-xs bg-slate-50">
            <div class="bg-slate-100 text-slate-800 p-2.5 rounded-2xl rounded-tl-none self-start leading-relaxed">
                👋 Ask me about road conditions on 3rd Mainland Bridge, Eko Bridge traffic, or rain fare surges!
            </div>
        </div>
        <div class="p-2.5 bg-white border-t border-slate-100 flex gap-2">
            <input type="text" id="ai-input" placeholder="Ask anything about this route..." class="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900" onkeypress="if(event.key === 'Enter') sendAI()"/>
            <button onclick="sendAI()" class="bg-slate-900 text-white px-3 rounded-xl text-xs font-bold hover:bg-slate-800">Send</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PAN-LAGOS HUBS WITH PRECISE COORDINATES
        // ==========================================
        const HUBS = {
            "ELEKO": { name: "Eleko Junction", zone: "Ibeju-Lekki", coords: [6.4700, 3.8600] },
            "EPE": { name: "Epe T-Junction", zone: "Epe Axis", coords: [6.5840, 3.9830] },
            "SANGOTEDO": { name: "Sangotedo / Novare Mall", zone: "Ajah Axis", coords: [6.4712, 3.6300] },
            "AJAH": { name: "Ajah Underbridge", zone: "Island East", coords: [6.4673, 3.5651] },
            "CHEVRON": { name: "Chevron Toll", zone: "Lekki", coords: [6.4380, 3.5350] },
            "LEKKI1": { name: "Lekki Phase 1 Gate", zone: "Lekki", coords: [6.4474, 3.4731] },
            "VI": { name: "Victoria Island (Eko Hotel)", zone: "Island", coords: [6.4281, 3.4219] },
            "OBALENDE": { name: "Obalende Terminal", zone: "Island", coords: [6.4502, 3.4150] },
            "CMS": { name: "CMS / Marina Hub & Metro", zone: "Island Central", coords: [6.4531, 3.3888] },
            "MILE2": { name: "Mile 2 Interchange & Rail", zone: "Mainland West", coords: [6.4627, 3.3032] },
            "FESTAC": { name: "Festac 1st Gate", zone: "Mainland West", coords: [6.4680, 3.2850] },
            "ORILE": { name: "Orile Rail Station", zone: "Mainland West", coords: [6.4710, 3.3420] },
            "COSTAIN": { name: "Costain / Eko Bridge", zone: "Mainland South", coords: [6.4810, 3.3680] },
            "SURULERE": { name: "Ojuelegba / Stadium", zone: "Surulere", coords: [6.5050, 3.3600] },
            "YABA": { name: "Yaba Tech / Tejuosho", zone: "Mainland Central", coords: [6.5167, 3.3765] },
            "OYINGBO": { name: "Oyingbo Terminal", zone: "Mainland Central", coords: [6.4800, 3.3830] },
            "OSHODI": { name: "Oshodi Transport Interchange", zone: "Interchange", coords: [6.5540, 3.3540] },
            "IKEJA": { name: "Ikeja Underbridge / Terminal", zone: "Capital Hub", coords: [6.5960, 3.3420] },
            "MARYLAND": { name: "Maryland BRT Hub", zone: "Mainland Central", coords: [6.5700, 3.3680] },
            "OJOTA": { name: "Ojota Main Terminal", zone: "Interchange", coords: [6.5850, 3.3860] },
            "KETU": { name: "Ketu Garage", zone: "Ikorodu Axis", coords: [6.6020, 3.3910] },
            "IKORODU": { name: "Ikorodu Garage & BRT", zone: "Ikorodu Axis", coords: [6.6180, 3.5080] },
            "BERGER": { name: "Berger Terminal", zone: "Interstate Link", coords: [6.6450, 3.3700] },
            "AGEGE": { name: "Agege Pen Cinema Rail", zone: "Mainland North", coords: [6.6200, 3.3280] },
            "ABULE_EGBA": { name: "Abule Egba BRT", zone: "Alimosho", coords: [6.6500, 3.2820] },
            "IYANA_IPAJA": { name: "Iyana Ipaja Main Garage", zone: "Alimosho", coords: [6.6110, 3.2790] },
            "EGBEDA": { name: "Egbeda Bus Stop", zone: "Alimosho", coords: [6.5920, 3.2880] },
            "IKOTUN": { name: "Ikotun Market", zone: "Alimosho", coords: [6.5560, 3.2680] },
            "IYANA_IBA": { name: "Iyana Iba / LASU Gate", zone: "Badagry Axis", coords: [6.4710, 3.1950] },
            "BADAGRY": { name: "Badagry Roundabout", zone: "Badagry Axis", coords: [6.4310, 2.8870] }
        };

        const EDGES = [
            { u: "EPE", v: "ELEKO", mode: "danfo", fare: 700, time: 25, desc: "Danfo along Lekki-Epe Expressway" },
            { u: "ELEKO", v: "SANGOTEDO", mode: "danfo", fare: 400, time: 20, desc: "Korope to Novare Mall / Sangotedo" },
            { u: "SANGOTEDO", v: "AJAH", mode: "danfo", fare: 300, time: 15, desc: "Danfo into Ajah Underbridge" },
            { u: "ELEKO", v: "AJAH", mode: "danfo", fare: 600, time: 30, desc: "Direct Coaster to Ajah Underbridge" },
            { u: "AJAH", v: "CHEVRON", mode: "danfo", fare: 200, time: 10, desc: "Danfo along Lekki corridor" },
            { u: "CHEVRON", v: "LEKKI1", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Lekki Phase 1 Gate" },
            { u: "LEKKI1", v: "VI", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Victoria Island" },
            { u: "LEKKI1", v: "OBALENDE", mode: "danfo", fare: 400, time: 20, desc: "Danfo via Lekki-Ikoyi Link Bridge" },
            { u: "AJAH", v: "CMS", mode: "danfo", fare: 800, time: 45, desc: "Direct Bus to CMS / Marina" },
            { u: "AJAH", v: "OSHODI", mode: "danfo", fare: 1000, time: 55, desc: "Direct Danfo via 3rd Mainland Bridge" },
            { u: "OBALENDE", v: "CMS", mode: "danfo", fare: 200, time: 10, desc: "Short transit hop to CMS" },
            
            // Blue Line Metro (Marina <-> Mile 2)
            { u: "CMS", v: "MILE2", mode: "rail", fare: 750, time: 20, desc: "LRMT Blue Line Metro (Elevated Track, 0 Traffic)" },
            { u: "CMS", v: "ORILE", mode: "rail", fare: 500, time: 12, desc: "LRMT Blue Line Train" },
            { u: "ORILE", v: "MILE2", mode: "rail", fare: 400, time: 8, desc: "LRMT Blue Line Train" },
            { u: "MILE2", v: "FESTAC", mode: "danfo", fare: 200, time: 10, desc: "Keke / Danfo into Festac" },
            { u: "MILE2", v: "IYANA_IBA", mode: "danfo", fare: 500, time: 30, desc: "Danfo from Mile 2 Oke to LASU/Iba" },
            { u: "IYANA_IBA", v: "BADAGRY", mode: "danfo", fare: 800, time: 45, desc: "Direct Danfo to Badagry" },

            // Central / Mainland
            { u: "CMS", v: "COSTAIN", mode: "danfo", fare: 300, time: 15, desc: "Danfo via Eko Bridge to Costain" },
            { u: "COSTAIN", v: "SURULERE", mode: "danfo", fare: 250, time: 12, desc: "Danfo to Ojuelegba / Stadium" },
            { u: "SURULERE", v: "YABA", mode: "danfo", fare: 200, time: 10, desc: "Danfo / Keke to Yaba Tech" },
            { u: "CMS", v: "YABA", mode: "brt", fare: 400, time: 25, desc: "BRT via Carter Bridge to Yaba" },
            { u: "YABA", v: "MARYLAND", mode: "brt", fare: 300, time: 15, desc: "BRT Corridor along Ikorodu Rd" },
            { u: "MARYLAND", v: "OJOTA", mode: "brt", fare: 200, time: 8, desc: "BRT lane to Ojota" },
            { u: "CMS", v: "IKORODU", mode: "brt", fare: 900, time: 50, desc: "Direct BRT from Marina to Ikorodu" },
            { u: "CMS", v: "IKORODU", mode: "ferry", fare: 1500, time: 35, desc: "Water Ferry from Marina Jetty to Ikorodu" },
            { u: "OJOTA", v: "IKORODU", mode: "brt", fare: 500, time: 30, desc: "Direct BRT corridor to Ikorodu Garage" },

            // Oshodi / Ikeja / North
            { u: "MILE2", v: "OSHODI", mode: "danfo", fare: 500, time: 25, desc: "Danfo via Oshodi-Apapa Expressway" },
            { u: "YABA", v: "OSHODI", mode: "danfo", fare: 350, time: 20, desc: "Danfo from Yaba / Jibowu to Oshodi" },
            { u: "OSHODI", v: "IKEJA", mode: "danfo", fare: 300, time: 15, desc: "Danfo / BRT to Ikeja Underbridge" },
            { u: "IKEJA", v: "VI", mode: "danfo", fare: 800, time: 40, desc: "Direct Danfo / AC Coaster to VI" },
            { u: "OSHODI", v: "MARYLAND", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Maryland Mall" },
            { u: "IKEJA", v: "BERGER", mode: "danfo", fare: 400, time: 20, desc: "Danfo to Berger Interstate Terminal" },
            { u: "OJOTA", v: "BERGER", mode: "danfo", fare: 300, time: 15, desc: "Danfo along Expressway to Berger" },
            { u: "IKEJA", v: "AGEGE", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Pen Cinema Agege" },
            { u: "AGEGE", v: "ABULE_EGBA", mode: "brt", fare: 250, time: 12, desc: "BRT to Abule Egba" },
            { u: "OSHODI", v: "ABULE_EGBA", mode: "brt", fare: 500, time: 25, desc: "Dedicated Oshodi-Abule Egba BRT Lane" },
            { u: "OSHODI", v: "IYANA_IPAJA", mode: "danfo", fare: 400, time: 25, desc: "Danfo to Iyana Ipaja Garage" },
            { u: "IYANA_IPAJA", v: "EGBEDA", mode: "danfo", fare: 200, time: 10, desc: "Danfo to Egbeda" },
            { u: "EGBEDA", v: "IKOTUN", mode: "danfo", fare: 250, time: 12, desc: "Danfo to Ikotun Market" },
            { u: "MILE2", v: "IKOTUN", mode: "danfo", fare: 450, time: 30, desc: "Danfo via Ago Palace Way to Ikotun" }
        ];

        const GRAPH = {};
        Object.keys(HUBS).forEach(k => GRAPH[k] = []);
        EDGES.forEach(e => {
            GRAPH[e.u].push({ to: e.v, mode: e.mode, fare: e.fare, time: e.time, desc: e.desc });
            GRAPH[e.v].push({ to: e.u, mode: e.mode, fare: e.fare, time: e.time, desc: e.desc });
        });

        // ==========================================
        // 2. MAP SETUP & AUTHENTICATED TILE LAYER
        // ==========================================
        const map = L.map('map', { zoomControl: false }).setView([6.5244, 3.3792], 11);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_42eu_1_6d0ada7c3bd84d557366ff2c', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        let activeLayers = [];
        let currentPosMarker = null;
        let activeFullRoadCoords = [];
        let isSheetExpanded = false;

        function clearMapLayers() {
            activeLayers.forEach(l => map.removeLayer(l));
            activeLayers = [];
        }

        // ==========================================
        // 3. REAL ROAD & TRACK GEOMETRY ENGINE (OSRM)
        // ==========================================
        async function fetchRealRoadPath(fromCoords, toCoords, mode) {
            // Specialized Track for Blue Line Metro (Marina -> National Theatre -> Orile -> Mile 2)
            if (mode === 'rail') {
                return [
                    [6.4531, 3.3888], // Marina Hub
                    [6.4630, 3.3710], // National Theatre
                    [6.4710, 3.3420], // Orile Iganmu
                    [6.4670, 3.3220], // Alaba Rail
                    [6.4627, 3.3032]  // Mile 2 Station
                ];
            }
            if (mode === 'ferry') {
                return [
                    [6.4531, 3.3888], // Marina Jetty
                    [6.4750, 3.4000], // Channel
                    [6.5400, 3.4400], // Lagos Lagoon
                    [6.6180, 3.5080]  // Ikorodu Jetty
                ];
            }

            // Real Road Snapping via OSRM Public Router
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${fromCoords[1]},${fromCoords[0]};${toCoords[1]},${toCoords[0]}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes[0] && data.routes[0].geometry) {
                    return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                }
            } catch (err) {
                console.warn("OSRM routing fallback:", err);
            }
            return [fromCoords, toCoords];
        }

        // ==========================================
        // 4. DIJKSTRA GRAPH SOLVER
        // ==========================================
        function solvePath(start, target) {
            const dist = {}, prev = {}, pq = [];
            Object.keys(HUBS).forEach(n => { dist[n] = Infinity; prev[n] = null; });
            dist[start] = 0;
            pq.push({ node: start, cost: 0 });

            while (pq.length > 0) {
                pq.sort((a, b) => a.cost - b.cost);
                const { node: current, cost } = pq.shift();
                if (current === target) break;
                if (cost > dist[current]) continue;

                (GRAPH[current] || []).forEach(edge => {
                    const newCost = dist[current] + edge.time;
                    if (newCost < dist[edge.to]) {
                        dist[edge.to] = newCost;
                        prev[edge.to] = { from: current, edge: edge };
                        pq.push({ node: edge.to, cost: newCost });
                    }
                });
            }

            if (dist[target] === Infinity) return null;
            const steps = [];
            let curr = target;
            while (prev[curr]) {
                steps.unshift({ from: prev[curr].from, to: curr, ...prev[curr].edge });
                curr = prev[curr].from;
            }

            return {
                title: 'Fastest Multi-Modal Road Route',
                steps: steps,
                totalFare: steps.reduce((a, s) => a + s.fare, 0),
                totalTime: steps.reduce((a, s) => a + s.time, 0)
            };
        }

        // ==========================================
        // 5. UI CONTROLLERS & BOTTOM SHEET LOGIC
        // ==========================================
        function populateDropdowns() {
            const orig = document.getElementById('origin-select');
            const dest = document.getElementById('dest-select');
            const sorted = Object.keys(HUBS).sort((a, b) => HUBS[a].name.localeCompare(HUBS[b].name));
            
            sorted.forEach(k => {
                orig.add(new Option(`${HUBS[k].name} (${HUBS[k].zone})`, k));
                dest.add(new Option(`${HUBS[k].name} (${HUBS[k].zone})`, k));
            });

            orig.value = "ELEKO";
            dest.value = "MILE2";
        }

        function toggleSearchModal() {
            const m = document.getElementById('search-modal');
            m.classList.toggle('hidden');
        }

        function toggleSheetExpand() {
            const sheet = document.getElementById('bottom-sheet');
            isSheetExpanded = !isSheetExpanded;
            if (isSheetExpanded) {
                sheet.style.maxHeight = '75vh';
            } else {
                sheet.style.maxHeight = '180px';
            }
        }

        function quickSet(u, v) {
            document.getElementById('origin-select').value = u;
            document.getElementById('dest-select').value = v;
            executeRouteSearch();
        }

        function swapLocations() {
            const o = document.getElementById('origin-select');
            const d = document.getElementById('dest-select');
            const t = o.value; o.value = d.value; d.value = t;
        }

        function getModeBadge(mode) {
            switch(mode) {
                case 'rail': return '<span class="px-2 py-0.5 rounded-md bg-blue-100 text-blue-800 font-bold text-[10px]">🚆 Blue Line Rail</span>';
                case 'brt': return '<span class="px-2 py-0.5 rounded-md bg-rose-100 text-rose-800 font-bold text-[10px]">🚌 BRT Lane</span>';
                case 'ferry': return '<span class="px-2 py-0.5 rounded-md bg-teal-100 text-teal-800 font-bold text-[10px]">⛴️ Ferry</span>';
                default: return '<span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 font-bold text-[10px]">🚐 Danfo</span>';
            }
        }

        function getModeColor(mode) {
            switch(mode) {
                case 'rail': return '#2563eb';
                case 'brt': return '#e11d48';
                case 'ferry': return '#0d9488';
                default: return '#f59e0b';
            }
        }

        async function executeRouteSearch() {
            // Close search modal
            document.getElementById('search-modal').classList.add('hidden');
            
            const start = document.getElementById('origin-select').value;
            const target = document.getElementById('dest-select').value;
            
            document.getElementById('search-pill-label').innerText = `${HUBS[start].name.split(' ')[0]} → ${HUBS[target].name.split(' ')[0]}`;

            const route = solvePath(start, target);
            if (!route) {
                alert("No mapped connection found between these locations.");
                return;
            }

            // Update Peek Bar
            const modes = [...new Set(route.steps.map(s => s.mode))];
            document.getElementById('peek-badges').innerHTML = modes.map(getModeBadge).join(' ');
            document.getElementById('peek-title').innerText = `${HUBS[start].name} → ${HUBS[target].name}`;
            document.getElementById('peek-fare').innerText = `₦${route.totalFare.toLocaleString()}`;
            document.getElementById('peek-time').innerText = `⏱ ~${route.totalTime} mins`;

            // Update Steps
            const stepsContainer = document.getElementById('steps-container');
            stepsContainer.innerHTML = route.steps.map((step, idx) => `
                <div class="relative pl-3 pb-2">
                    <span class="absolute -left-[19px] top-1 w-2.5 h-2.5 rounded-full border-2 border-white" style="background-color: ${getModeColor(step.mode)}"></span>
                    <div class="flex justify-between items-baseline">
                        <h4 class="text-xs font-bold text-slate-900">${idx + 1}. ${HUBS[step.from].name} → ${HUBS[step.to].name}</h4>
                        <span class="text-[11px] font-extrabold text-slate-700">₦${step.fare}</span>
                    </div>
                    <p class="text-[11px] text-slate-500 mt-0.5">${step.desc}</p>
                    <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-medium mt-1 inline-block">⏱ ~${step.time} mins</span>
                </div>
            `).join('');

            // Collapse bottom sheet to peek mode so full map is clearly visible
            const sheet = document.getElementById('bottom-sheet');
            sheet.style.maxHeight = '180px';
            isSheetExpanded = false;

            // Render Road-Snapped Geometry on Map
            await renderRoadRouteOnMap(route.steps);
        }

        async function renderRoadRouteOnMap(steps) {
            clearMapLayers();
            activeFullRoadCoords = [];
            const allBoundsCoords = [];

            for (let i = 0; i < steps.length; i++) {
                const step = steps[i];
                const fromCoords = HUBS[step.from].coords;
                const toCoords = HUBS[step.to].coords;
                const color = getModeColor(step.mode);

                allBoundsCoords.push(fromCoords, toCoords);

                // Fetch real road coordinates via OSRM
                const roadCoords = await fetchRealRoadPath(fromCoords, toCoords, step.mode);
                activeFullRoadCoords.push(...roadCoords);

                // Road Polyline
                const line = L.polyline(roadCoords, {
                    color: color,
                    weight: 6,
                    opacity: 0.9,
                    lineJoin: 'round',
                    lineCap: 'round',
                    dashArray: step.mode === 'danfo' ? '4, 8' : null
                }).addTo(map);
                activeLayers.push(line);

                // Hub Marker
                const mk = L.circleMarker(fromCoords, {
                    radius: 6,
                    fillColor: color,
                    color: "#ffffff",
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup(`<strong class="text-xs">${HUBS[step.from].name}</strong>`);
                activeLayers.push(mk);

                if (i === steps.length - 1) {
                    const destMk = L.circleMarker(toCoords, {
                        radius: 8,
                        fillColor: "#0f172a",
                        color: "#ffffff",
                        weight: 2,
                        fillOpacity: 1
                    }).addTo(map).bindPopup(`<strong class="text-xs">Destination: ${HUBS[step.to].name}</strong>`);
                    activeLayers.push(destMk);
                }
            }

            // Fit Map Viewport with mobile bottom offset padding
            if (activeFullRoadCoords.length > 0) {
                map.fitBounds(L.latLngBounds(activeFullRoadCoords), {
                    paddingTopLeft: [40, 40],
                    paddingBottomRight: [40, 220] // Reserve space for mobile bottom sheet
                });
            }
        }

        // ==========================================
        // 6. LIVE ROAD GNSS NAVIGATION
        // ==========================================
        function startNavigation(e) {
            e.stopPropagation();
            const btn = document.getElementById('nav-btn');
            btn.innerHTML = '<span>🛰️</span> <span class="animate-pulse">Live Road Navigation Active...</span>';
            btn.className = 'w-full bg-emerald-600 text-white py-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 shadow-md';

            const gnssIcon = L.divIcon({
                className: '',
                html: '<div class="gps-indicator"></div>',
                iconSize: [18, 18], iconAnchor: [9, 9]
            });

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (!currentPosMarker) {
                        currentPosMarker = L.marker([lat, lng], {icon: gnssIcon}).addTo(map);
                        activeLayers.push(currentPosMarker);
                    } else {
                        currentPosMarker.setLatLng([lat, lng]);
                    }
                    map.panTo([lat, lng]);
                }, err => {
                    simulateRoadGPS();
                }, { enableHighAccuracy: true });
            } else {
                simulateRoadGPS();
            }
        }

        function simulateRoadGPS() {
            if (activeFullRoadCoords.length === 0) return;

            const gnssIcon = L.divIcon({ className: '', html: '<div class="gps-indicator"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
            let idx = 0;
            if (!currentPosMarker) {
                currentPosMarker = L.marker(activeFullRoadCoords[idx], {icon: gnssIcon}).addTo(map);
                activeLayers.push(currentPosMarker);
            }

            // Animate along real road points
            setInterval(() => {
                idx = (idx + 1) % activeFullRoadCoords.length;
                currentPosMarker.setLatLng(activeFullRoadCoords[idx]);
                map.panTo(activeFullRoadCoords[idx]);
            }, 1200);
        }

        // ==========================================
        // 7. AI ASSISTANT MODAL
        // ==========================================
        function toggleAI() {
            const m = document.getElementById('ai-modal');
            m.classList.toggle('hidden');
            m.classList.toggle('flex');
        }

        function sendAI() {
            const inp = document.getElementById('ai-input');
            const chat = document.getElementById('ai-chat');
            const text = inp.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="bg-slate-900 text-white p-2.5 rounded-2xl rounded-tr-none self-end text-xs ml-auto w-10/12 mb-1.5 font-medium">${text}</div>`;
            inp.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                let reply = "Keep small change (₦200, ₦500) handy for Danfo conductors and top up your Cowry Card for Blue Line Rail and BRT lanes.";
                if (text.toLowerCase().includes("rain") || text.toLowerCase().includes("surge")) {
                    reply = "🌧️ During rain, Lekki-Epe expressway Danfo fares surge by ₦300–₦500. The Blue Line train is immune to rain delays and surges.";
                } else if (text.toLowerCase().includes("traffic") || text.toLowerCase().includes("bridge")) {
                    reply = "🚗 3rd Mainland Bridge is moving well westbound. Eko bridge has typical slowdown around Costain junction.";
                }
                chat.innerHTML += `<div class="bg-slate-100 text-slate-800 p-2.5 rounded-2xl rounded-tl-none self-start text-xs w-11/12 mb-1.5 border border-slate-200/60"><b>AI Advisor:</b> ${reply}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 800);
        }

        window.onload = () => {
            populateDropdowns();
            executeRouteSearch();
        };
    </script>
</body>
</html>
