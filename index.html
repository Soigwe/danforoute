<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanfoRoute - Clean Lagos Transit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .leaflet-control-container { z-index: 10; }
        .leaflet-bar { border: none !important; box-shadow: 0 4px 20px rgba(0,0,0,0.08) !important; border-radius: 12px !important; overflow: hidden; }
        .leaflet-bar a { border: none !important; color: #1e293b !important; }
        
        /* GNSS Pulsing dot */
        .gps-indicator {
            width: 16px;
            height: 16px;
            background-color: #2563eb;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.3);
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-900 text-slate-900 select-none">

    <!-- Main Map Background -->
    <div id="map" class="absolute inset-0"></div>

    <!-- Floating Floating Search & Routing Panel -->
    <div class="absolute top-4 left-4 bottom-4 w-[400px] max-w-[calc(100vw-32px)] z-[1000] flex flex-col pointer-events-none">
        
        <!-- Main Card Container -->
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-slate-100/80 flex flex-col pointer-events-auto h-full overflow-hidden transition-all duration-300">
            
            <!-- App Header -->
            <div class="px-6 pt-5 pb-4 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-2xl bg-amber-400 flex items-center justify-center shadow-sm text-lg font-black">
                        🚌
                    </div>
                    <div>
                        <h1 class="text-base font-extrabold text-slate-900 tracking-tight leading-tight">DanfoRoute</h1>
                        <p class="text-[11px] font-medium text-slate-400">Lagos Transit & Commute</p>
                    </div>
                </div>

                <!-- AI Quick Trigger -->
                <button onclick="toggleAI()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
                    <span>✨</span>
                    <span>Ask AI</span>
                </button>
            </div>

            <!-- Route Inputs -->
            <div class="p-5 pb-3">
                <div class="relative bg-slate-50 p-2 rounded-2xl border border-slate-200/80 space-y-1.5">
                    <!-- Origin -->
                    <div class="flex items-center px-2 py-1">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-3 shrink-0 ring-4 ring-emerald-100"></span>
                        <select id="origin-select" onchange="calculateRoutes()" class="w-full bg-transparent text-xs font-semibold text-slate-800 focus:outline-none cursor-pointer truncate">
                            <!-- Populated by JS -->
                        </select>
                    </div>

                    <div class="h-px bg-slate-200/60 mx-6 relative">
                        <!-- Swap button -->
                        <button onclick="swapLocations()" class="absolute -top-3 right-2 w-6 h-6 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-500 hover:text-slate-900 hover:scale-110 transition text-[10px] font-bold">
                            ⇅
                        </button>
                    </div>

                    <!-- Destination -->
                    <div class="flex items-center px-2 py-1">
                        <span class="w-2.5 h-2.5 rounded-full bg-rose-500 mr-3 shrink-0 ring-4 ring-rose-100"></span>
                        <select id="dest-select" onchange="calculateRoutes()" class="w-full bg-transparent text-xs font-semibold text-slate-800 focus:outline-none cursor-pointer truncate">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                </div>

                <!-- Quick Presets / Hub Chips -->
                <div class="flex gap-1.5 overflow-x-auto pt-3 pb-1 no-scrollbar text-[11px]">
                    <span class="text-slate-400 self-center text-[10px] font-bold uppercase tracking-wider shrink-0 mr-1">Popular:</span>
                    <button onclick="quickSet('ELEKO', 'MILE2')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Eleko → Mile 2</button>
                    <button onclick="quickSet('IKORODU', 'CMS')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Ikorodu → CMS</button>
                    <button onclick="quickSet('IKEJA', 'VI')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Ikeja → VI</button>
                    <button onclick="quickSet('AJAH', 'OSHODI')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-900 font-medium whitespace-nowrap transition">Ajah → Oshodi</button>
                </div>
            </div>

            <!-- Route Options List -->
            <div id="routes-list" class="flex-1 overflow-y-auto px-5 pb-5 space-y-3">
                <!-- Dynamically injected route cards -->
            </div>

            <!-- Panel Footer Status -->
            <div class="p-4 bg-slate-50 border-t border-slate-100 text-[11px] text-slate-500 flex items-center justify-between">
                <span class="flex items-center gap-1.5 font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Live Lagos transit network
                </span>
                <button onclick="useCurrentLocation()" class="text-blue-600 font-bold hover:underline flex items-center gap-1">
                    <span>📍</span> My Location
                </button>
            </div>
        </div>
    </div>

    <!-- Minimal AI Assistant Drawer / Modal -->
    <div id="ai-modal" class="absolute bottom-6 right-6 w-96 max-w-[calc(100vw-48px)] z-[1000] hidden flex-col bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-slate-100 overflow-hidden transition-all duration-300">
        <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-sm">🤖</span>
                <div>
                    <h3 class="text-xs font-bold leading-tight">Lagos Transit Assistant</h3>
                    <p class="text-[10px] text-slate-400">Contextual advice & safety tips</p>
                </div>
            </div>
            <button onclick="toggleAI()" class="text-slate-400 hover:text-white text-lg font-bold leading-none">&times;</button>
        </div>
        <div id="ai-chat" class="h-64 p-4 overflow-y-auto space-y-2.5 text-xs bg-slate-50/50">
            <div class="bg-slate-100 text-slate-800 p-3 rounded-2xl rounded-tl-none self-start leading-relaxed">
                👋 <b>How can I assist your commute?</b> Ask about current road jams, Danfo rain surcharges, bus stop safety, or Cowry card fares.
            </div>
        </div>
        <div class="p-3 bg-white border-t border-slate-100 flex gap-2">
            <input type="text" id="ai-input" placeholder="Ask anything about this route..." class="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-slate-900" onkeypress="if(event.key === 'Enter') sendAI()"/>
            <button onclick="sendAI()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 rounded-xl text-xs font-bold transition">Send</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. TRANSIT HUBS (30+ Major Hubs)
        // ==========================================
        const HUBS = {
            "ELEKO": { name: "Eleko Junction", zone: "Ibeju-Lekki", coords: [6.4700, 3.8600] },
            "EPE": { name: "Epe T-Junction", zone: "Epe Axis", coords: [6.5840, 3.9830] },
            "SANGOTEDO": { name: "Sangotedo / Novare Mall", zone: "Ajah Axis", coords: [6.4712, 3.6300] },
            "AJAH": { name: "Ajah Underbridge", zone: "Island East", coords: [6.4673, 3.5651] },
            "CHEVRON": { name: "Chevron Toll", zone: "Lekki", coords: [6.4380, 3.5350] },
            "LEKKI1": { name: "Lekki Phase 1 (Admiralty)", zone: "Lekki", coords: [6.4474, 3.4731] },
            "VI": { name: "Victoria Island (Eko Hotel)", zone: "Island", coords: [6.4281, 3.4219] },
            "OBALENDE": { name: "Obalende Terminal", zone: "Island", coords: [6.4502, 3.4150] },
            "CMS": { name: "CMS / Marina Hub & Metro", zone: "Island Central", coords: [6.4531, 3.3888] },
            "MILE2": { name: "Mile 2 Interchange & Rail", zone: "Mainland West", coords: [6.4627, 3.3032] },
            "FESTAC": { name: "Festac 1st Gate", zone: "Mainland West", coords: [6.4680, 3.2850] },
            "ORILE": { name: "Orile Rail Station", zone: "Mainland West", coords: [6.4710, 3.3420] },
            "COSTAIN": { name: "Costain / Eko Bridge", zone: "Mainland South", coords: [6.4810, 3.3680] },
            "SURULERE": { name: "Ojuelegba / Stadium", zone: "Surulere", coords: [6.5050, 3.3600] },
            "YABA": { name: "Yaba Tech / Tejuosho", zone: "Mainland Central", coords: [6.5167, 3.3765] },
            "OYINGBO": { name: "Oyingbo Terminal", zone: "Mainland Central", coords: [6.4800, 3.3830] },
            "OSHODI": { name: "Oshodi Transport Interchange", zone: "Interchange", coords: [6.5540, 3.3540] },
            "IKEJA": { name: "Ikeja Underbridge / Terminal", zone: "Capital Hub", coords: [6.5960, 3.3420] },
            "MARYLAND": { name: "Maryland BRT Hub", zone: "Mainland Central", coords: [6.5700, 3.3680] },
            "OJOTA": { name: "Ojota Main Terminal", zone: "Interchange", coords: [6.5850, 3.3860] },
            "KETU": { name: "Ketu Garage", zone: "Ikorodu Axis", coords: [6.6020, 3.3910] },
            "IKORODU": { name: "Ikorodu Garage & BRT", zone: "Ikorodu Axis", coords: [6.6180, 3.5080] },
            "BERGER": { name: "Berger Terminal", zone: "Interstate Link", coords: [6.6450, 3.3700] },
            "AGEGE": { name: "Agege Pen Cinema Rail", zone: "Mainland North", coords: [6.6200, 3.3280] },
            "ABULE_EGBA": { name: "Abule Egba BRT", zone: "Alimosho", coords: [6.6500, 3.2820] },
            "IYANA_IPAJA": { name: "Iyana Ipaja Main Garage", zone: "Alimosho", coords: [6.6110, 3.2790] },
            "EGBEDA": { name: "Egbeda Bus Stop", zone: "Alimosho", coords: [6.5920, 3.2880] },
            "IKOTUN": { name: "Ikotun Market", zone: "Alimosho", coords: [6.5560, 3.2680] },
            "IYANA_IBA": { name: "Iyana Iba / LASU Gate", zone: "Badagry Axis", coords: [6.4710, 3.1950] },
            "BADAGRY": { name: "Badagry Roundabout", zone: "Badagry Axis", coords: [6.4310, 2.8870] }
        };

        // ==========================================
        // 2. NETWORK EDGES
        // ==========================================
        const EDGES = [
            { u: "EPE", v: "ELEKO", mode: "danfo", fare: 700, time: 25, desc: "Danfo along Lekki-Epe Expressway" },
            { u: "ELEKO", v: "SANGOTEDO", mode: "danfo", fare: 400, time: 20, desc: "Korope to Novare Mall / Sangotedo" },
            { u: "SANGOTEDO", v: "AJAH", mode: "danfo", fare: 300, time: 15, desc: "Danfo into Ajah Underbridge" },
            { u: "ELEKO", v: "AJAH", mode: "danfo", fare: 600, time: 30, desc: "Direct Coaster to Ajah Underbridge" },
            { u: "AJAH", v: "CHEVRON", mode: "danfo", fare: 200, time: 10, desc: "Danfo along Lekki corridor" },
            { u: "CHEVRON", v: "LEKKI1", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Lekki Phase 1 Gate" },
            { u: "LEKKI1", v: "VI", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Victoria Island" },
            { u: "LEKKI1", v: "OBALENDE", mode: "danfo", fare: 400, time: 20, desc: "Danfo via Lekki-Ikoyi Link Bridge" },
            { u: "AJAH", v: "CMS", mode: "danfo", fare: 800, time: 45, desc: "Direct Bus to CMS / Marina" },
            { u: "AJAH", v: "OSHODI", mode: "danfo", fare: 1000, time: 55, desc: "Direct Danfo via 3rd Mainland Bridge" },
            { u: "OBALENDE", v: "CMS", mode: "danfo", fare: 200, time: 10, desc: "Short transit hop to CMS" },
            
            // Rail & Mainland West
            { u: "CMS", v: "MILE2", mode: "rail", fare: 750, time: 20, desc: "LRMT Blue Line Metro (Fast & Zero Traffic)" },
            { u: "CMS", v: "ORILE", mode: "rail", fare: 500, time: 12, desc: "LRMT Blue Line Train" },
            { u: "ORILE", v: "MILE2", mode: "rail", fare: 400, time: 8, desc: "LRMT Blue Line Train" },
            { u: "MILE2", v: "FESTAC", mode: "danfo", fare: 200, time: 10, desc: "Keke / Danfo into Festac" },
            { u: "MILE2", v: "IYANA_IBA", mode: "danfo", fare: 500, time: 30, desc: "Danfo from Mile 2 Oke to LASU/Iba" },
            { u: "IYANA_IBA", v: "BADAGRY", mode: "danfo", fare: 800, time: 45, desc: "Direct Danfo to Badagry" },

            // Central / Mainland
            { u: "CMS", v: "COSTAIN", mode: "danfo", fare: 300, time: 15, desc: "Danfo via Eko Bridge to Costain" },
            { u: "COSTAIN", v: "SURULERE", mode: "danfo", fare: 250, time: 12, desc: "Danfo to Ojuelegba / Stadium" },
            { u: "SURULERE", v: "YABA", mode: "danfo", fare: 200, time: 10, desc: "Danfo / Keke to Yaba Tech" },
            { u: "CMS", v: "YABA", mode: "brt", fare: 400, time: 25, desc: "BRT via Carter Bridge to Yaba" },
            { u: "YABA", v: "MARYLAND", mode: "brt", fare: 300, time: 15, desc: "BRT Corridor along Ikorodu Rd" },
            { u: "MARYLAND", v: "OJOTA", mode: "brt", fare: 200, time: 8, desc: "BRT lane to Ojota" },
            { u: "CMS", v: "IKORODU", mode: "brt", fare: 900, time: 50, desc: "Direct BRT from Marina to Ikorodu" },
            { u: "CMS", v: "IKORODU", mode: "ferry", fare: 1500, time: 35, desc: "Water Ferry from Marina Jetty to Ikorodu" },
            { u: "OJOTA", v: "IKORODU", mode: "brt", fare: 500, time: 30, desc: "Direct BRT corridor to Ikorodu Garage" },

            // Oshodi / Ikeja / North
            { u: "MILE2", v: "OSHODI", mode: "danfo", fare: 500, time: 25, desc: "Danfo via Oshodi-Apapa Expressway" },
            { u: "YABA", v: "OSHODI", mode: "danfo", fare: 350, time: 20, desc: "Danfo from Yaba / Jibowu to Oshodi" },
            { u: "OSHODI", v: "IKEJA", mode: "danfo", fare: 300, time: 15, desc: "Danfo / BRT to Ikeja Underbridge" },
            { u: "IKEJA", v: "VI", mode: "danfo", fare: 800, time: 40, desc: "Direct Danfo / AC Coaster to VI" },
            { u: "OSHODI", v: "MARYLAND", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Maryland Mall" },
            { u: "IKEJA", v: "BERGER", mode: "danfo", fare: 400, time: 20, desc: "Danfo to Berger Interstate Terminal" },
            { u: "OJOTA", v: "BERGER", mode: "danfo", fare: 300, time: 15, desc: "Danfo along Expressway to Berger" },
            { u: "IKEJA", v: "AGEGE", mode: "danfo", fare: 300, time: 15, desc: "Danfo to Pen Cinema Agege" },
            { u: "AGEGE", v: "ABULE_EGBA", mode: "brt", fare: 250, time: 12, desc: "BRT to Abule Egba" },
            { u: "OSHODI", v: "ABULE_EGBA", mode: "brt", fare: 500, time: 25, desc: "Dedicated Oshodi-Abule Egba BRT Lane" },
            { u: "OSHODI", v: "IYANA_IPAJA", mode: "danfo", fare: 400, time: 25, desc: "Danfo to Iyana Ipaja Garage" },
            { u: "IYANA_IPAJA", v: "EGBEDA", mode: "danfo", fare: 200, time: 10, desc: "Danfo to Egbeda" },
            { u: "EGBEDA", v: "IKOTUN", mode: "danfo", fare: 250, time: 12, desc: "Danfo to Ikotun Market" },
            { u: "MILE2", v: "IKOTUN", mode: "danfo", fare: 450, time: 30, desc: "Danfo via Ago Palace Way to Ikotun" }
        ];

        // Build Graph
        const GRAPH = {};
        Object.keys(HUBS).forEach(k => GRAPH[k] = []);
        EDGES.forEach(e => {
            GRAPH[e.u].push({ to: e.v, mode: e.mode, fare: e.fare, time: e.time, desc: e.desc });
            GRAPH[e.v].push({ to: e.u, mode: e.mode, fare: e.fare, time: e.time, desc: e.desc });
        });

        // ==========================================
        // 3. MAP INITIALIZATION (Minimalist Theme)
        // ==========================================
        const map = L.map('map', { zoomControl: false }).setView([6.5244, 3.3792], 11);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // CartoDB Voyager Tile Layer with API Key
        L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_42eu_1_6d0ada7c3bd84d557366ff2c', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        let activeLayers = [];
        let currentPosMarker = null;

        function clearMap() {
            activeLayers.forEach(l => map.removeLayer(l));
            activeLayers = [];
        }

        // ==========================================
        // 4. SHORTEST PATH ROUTER (Dijkstra)
        // ==========================================
        function solvePath(start, target, weightKey) {
            const dist = {}, prev = {}, pq = [];
            Object.keys(HUBS).forEach(n => { dist[n] = Infinity; prev[n] = null; });
            dist[start] = 0;
            pq.push({ node: start, cost: 0 });

            while (pq.length > 0) {
                pq.sort((a, b) => a.cost - b.cost);
                const { node: current, cost } = pq.shift();
                if (current === target) break;
                if (cost > dist[current]) continue;

                (GRAPH[current] || []).forEach(edge => {
                    const newCost = dist[current] + edge[weightKey];
                    if (newCost < dist[edge.to]) {
                        dist[edge.to] = newCost;
                        prev[edge.to] = { from: current, edge: edge };
                        pq.push({ node: edge.to, cost: newCost });
                    }
                });
            }

            if (dist[target] === Infinity) return null;
            const steps = [];
            let curr = target;
            while (prev[curr]) {
                steps.unshift({ from: prev[curr].from, to: curr, ...prev[curr].edge });
                curr = prev[curr].from;
            }

            return {
                title: weightKey === 'time' ? 'Fastest Multi-Modal' : 'Cheapest Route',
                steps: steps,
                totalFare: steps.reduce((a, s) => a + s.fare, 0),
                totalTime: steps.reduce((a, s) => a + s.time, 0)
            };
        }

        // ==========================================
        // 5. UI CONTROLLERS
        // ==========================================
        function populateDropdowns() {
            const orig = document.getElementById('origin-select');
            const dest = document.getElementById('dest-select');
            const sorted = Object.keys(HUBS).sort((a, b) => HUBS[a].name.localeCompare(HUBS[b].name));
            
            sorted.forEach(k => {
                orig.add(new Option(`${HUBS[k].name} (${HUBS[k].zone})`, k));
                dest.add(new Option(`${HUBS[k].name} (${HUBS[k].zone})`, k));
            });

            orig.value = "ELEKO";
            dest.value = "MILE2";
        }

        function quickSet(u, v) {
            document.getElementById('origin-select').value = u;
            document.getElementById('dest-select').value = v;
            calculateRoutes();
        }

        function swapLocations() {
            const o = document.getElementById('origin-select');
            const d = document.getElementById('dest-select');
            const t = o.value; o.value = d.value; d.value = t;
            calculateRoutes();
        }

        function getModeBadge(mode) {
            switch(mode) {
                case 'rail': return '<span class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-700 font-bold text-[10px]">🚆 Blue Line Rail</span>';
                case 'brt': return '<span class="px-2 py-0.5 rounded-md bg-rose-50 text-rose-700 font-bold text-[10px]">🚌 BRT Lane</span>';
                case 'ferry': return '<span class="px-2 py-0.5 rounded-md bg-teal-50 text-teal-700 font-bold text-[10px]">⛴️ Ferry</span>';
                default: return '<span class="px-2 py-0.5 rounded-md bg-amber-50 text-amber-800 font-bold text-[10px]">🚐 Danfo</span>';
            }
        }

        function getModeColor(mode) {
            switch(mode) {
                case 'rail': return '#2563eb';
                case 'brt': return '#e11d48';
                case 'ferry': return '#0d9488';
                default: return '#f59e0b';
            }
        }

        let currentActiveRouteIndex = 0;
        let globalRoutes = [];

        function calculateRoutes() {
            const start = document.getElementById('origin-select').value;
            const target = document.getElementById('dest-select').value;
            const container = document.getElementById('routes-list');

            if (start === target) {
                container.innerHTML = `<div class="p-4 bg-slate-50 text-slate-500 text-xs rounded-2xl text-center">Please select different origin and destination stops.</div>`;
                return;
            }

            const fastest = solvePath(start, target, 'time');
            const cheapest = solvePath(start, target, 'fare');
            
            globalRoutes = [];
            if (fastest) globalRoutes.push(fastest);
            if (cheapest && JSON.stringify(cheapest.steps) !== JSON.stringify(fastest?.steps)) {
                globalRoutes.push(cheapest);
            }

            container.innerHTML = '';
            if (globalRoutes.length === 0) {
                container.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 text-xs rounded-2xl text-center">No mapped route between these hubs yet.</div>`;
                return;
            }

            globalRoutes.forEach((route, idx) => {
                const card = document.createElement('div');
                card.className = `border rounded-2xl p-4 transition-all duration-200 cursor-pointer ${idx === 0 ? 'bg-white border-slate-900 shadow-md ring-1 ring-slate-900/5' : 'bg-slate-50 border-slate-200/80 hover:bg-white'}`;
                
                // Mode summary pills
                const modes = [...new Set(route.steps.map(s => s.mode))];
                const modePills = modes.map(getModeBadge).join(' ');

                card.innerHTML = `
                    <div onclick="selectRouteCard(${idx})" class="flex justify-between items-start">
                        <div class="space-y-1">
                            <div class="flex items-center gap-1.5">${modePills}</div>
                            <h3 class="text-xs font-extrabold text-slate-900">${route.title}</h3>
                            <p class="text-[11px] text-slate-400 font-medium">${route.steps.length} transit legs</p>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-black text-slate-900">₦${route.totalFare.toLocaleString()}</div>
                            <div class="text-[11px] font-semibold text-emerald-600">⏱ ~${route.totalTime} mins</div>
                        </div>
                    </div>

                    <!-- Step by step details -->
                    <div id="details-${idx}" class="${idx === 0 ? 'block' : 'hidden'} mt-4 pt-3 border-t border-slate-100">
                        <div class="space-y-3 relative pl-3 border-l-2 border-slate-100 ml-1">
                            ${route.steps.map((step, sIdx) => `
                                <div class="relative pl-3">
                                    <span class="absolute -left-[19px] top-1 w-2.5 h-2.5 rounded-full border-2 border-white" style="background-color: ${getModeColor(step.mode)}"></span>
                                    <div class="flex justify-between items-baseline">
                                        <h4 class="text-xs font-bold text-slate-800">${HUBS[step.from].name} → ${HUBS[step.to].name}</h4>
                                        <span class="text-[11px] font-extrabold text-slate-600">₦${step.fare}</span>
                                    </div>
                                    <p class="text-[11px] text-slate-400 mt-0.5 leading-snug">${step.desc}</p>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Action Button -->
                        <button onclick="startNavigation(event)" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-sm transition active:scale-95">
                            <span>🛰️</span>
                            <span>Start Live Navigation</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            selectRouteCard(0);
        }

        function selectRouteCard(idx) {
            currentActiveRouteIndex = idx;
            document.querySelectorAll('[id^="details-"]').forEach((el, i) => {
                el.className = i === idx ? 'block mt-4 pt-3 border-t border-slate-100' : 'hidden';
            });
            renderOnMap(globalRoutes[idx].steps);
        }

        function renderOnMap(steps) {
            clearMap();
            const latLngs = [];

            steps.forEach((step, idx) => {
                const fromCoords = HUBS[step.from].coords;
                const toCoords = HUBS[step.to].coords;
                const color = getModeColor(step.mode);

                if (idx === 0) latLngs.push(fromCoords);
                latLngs.push(toCoords);

                // Segment line
                const line = L.polyline([fromCoords, toCoords], {
                    color: color,
                    weight: 5,
                    opacity: 0.9,
                    lineCap: 'round',
                    dashArray: step.mode === 'danfo' ? '4, 8' : null
                }).addTo(map);
                activeLayers.push(line);

                // Markers
                const mk = L.circleMarker(fromCoords, {
                    radius: 6,
                    fillColor: color,
                    color: "#ffffff",
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup(`<strong class="text-xs">${HUBS[step.from].name}</strong>`);
                activeLayers.push(mk);

                if (idx === steps.length - 1) {
                    const destMk = L.circleMarker(toCoords, {
                        radius: 8,
                        fillColor: "#0f172a",
                        color: "#ffffff",
                        weight: 2,
                        fillOpacity: 1
                    }).addTo(map).bindPopup(`<strong class="text-xs">Destination: ${HUBS[step.to].name}</strong>`);
                    activeLayers.push(destMk);
                }
            });

            map.fitBounds(L.latLngBounds(latLngs), { padding: [60, 60] });
        }

        // ==========================================
        // 6. GNSS / GPS LIVE TRACKING
        // ==========================================
        function startNavigation(e) {
            e.stopPropagation();
            const btn = e.currentTarget;
            btn.innerHTML = '<span>📡</span> <span class="animate-pulse">GNSS Tracking Active</span>';
            btn.className = 'mt-4 w-full bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-sm';

            const gnssIcon = L.divIcon({
                className: '',
                html: '<div class="gps-indicator"></div>',
                iconSize: [16, 16], iconAnchor: [8, 8]
            });

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (!currentPosMarker) {
                        currentPosMarker = L.marker([lat, lng], {icon: gnssIcon}).addTo(map);
                        activeLayers.push(currentPosMarker);
                    } else {
                        currentPosMarker.setLatLng([lat, lng]);
                    }
                    map.panTo([lat, lng]);
                }, err => {
                    simulateGPS();
                }, { enableHighAccuracy: true });
            } else {
                simulateGPS();
            }
        }

        function simulateGPS() {
            const steps = globalRoutes[currentActiveRouteIndex].steps;
            const coords = steps.map(s => HUBS[s.from].coords);
            coords.push(HUBS[steps[steps.length - 1].to].coords);

            const gnssIcon = L.divIcon({ className: '', html: '<div class="gps-indicator"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
            let idx = 0;
            if (!currentPosMarker) {
                currentPosMarker = L.marker(coords[idx], {icon: gnssIcon}).addTo(map);
                activeLayers.push(currentPosMarker);
            }
            setInterval(() => {
                idx = (idx + 1) % coords.length;
                currentPosMarker.setLatLng(coords[idx]);
                map.panTo(coords[idx]);
            }, 3000);
        }

        function useCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('origin-select').value = "CMS";
                    calculateRoutes();
                });
            }
        }

        // ==========================================
        // 7. AI ASSISTANT MODAL
        // ==========================================
        function toggleAI() {
            const m = document.getElementById('ai-modal');
            m.classList.toggle('hidden');
            m.classList.toggle('flex');
        }

        function sendAI() {
            const inp = document.getElementById('ai-input');
            const chat = document.getElementById('ai-chat');
            const text = inp.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="bg-slate-900 text-white p-2.5 rounded-2xl rounded-tr-none self-end text-xs ml-auto w-10/12 mb-1.5 leading-relaxed font-medium">${text}</div>`;
            inp.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                let reply = "Ensure you hold some small cash notes (₦200, ₦500) for Danfo conductors to avoid change arguments, and keep your Cowry Card ready for BRT and Blue Line terminals.";
                if (text.toLowerCase().includes("safe") || text.toLowerCase().includes("night")) {
                    reply = "Late-night commutes in Lagos are best done via dedicated BRT buses or the Blue Line train from Marina. Avoid boarding unbranded empty Danfos alone at secluded stops.";
                } else if (text.toLowerCase().includes("rain") || text.toLowerCase().includes("surge")) {
                    reply = "Heavy rains typically spike Danfo fares along the Lekki-Epe expressway and Ikorodu Road by ~30–50%. The Blue Line Train and dedicated BRT lines have locked standard fares.";
                }
                chat.innerHTML += `<div class="bg-slate-100 text-slate-800 p-3 rounded-2xl rounded-tl-none self-start text-xs w-11/12 mb-1.5 border border-slate-200/50 leading-relaxed"><b>AI Assistant:</b> ${reply}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 800);
        }

        window.onload = () => {
            populateDropdowns();
            calculateRoutes();
        };
    </script>
</body>
</html>
